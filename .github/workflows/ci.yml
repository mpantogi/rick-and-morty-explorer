name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Before setup-node: its Yarn cache lookup must see Yarn 4 from packageManager, not the runner's 1.x.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - run: yarn npm audit --all --recursive
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:coverage
      - run: yarn build
      - run: yarn check:budget
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          include-hidden-files: false

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --immutable
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: yarn playwright install --with-deps chromium firefox webkit
      - run: yarn test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
