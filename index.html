<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        if (localStorage.getItem('rme:theme') === 'dark')
          document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202329" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://rickandmortyapi.com" />
    <link rel="preconnect" href="https://rickandmortyapi.com" crossorigin />
    <title>Rick and Morty Explorer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
